version: 2

# Routine version updates are off while Filing Footnote is built:
# `open-pull-requests-limit: 0` disables them per ecosystem. Dependabot security
# updates are configured separately in repository settings and still open pull
# requests, because a vulnerability fix is still wanted while a routine bump is not.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0
