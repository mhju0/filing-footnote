name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: filing_footnote
          POSTGRES_PASSWORD: filing_footnote_dev
          POSTGRES_DB: filing_footnote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filing_footnote -d filing_footnote"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://filing_footnote:filing_footnote_dev@localhost:5432/filing_footnote
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.lock
          pip install ruff==0.15.21
      - name: Lint, offline tests, and Compose validation
        run: make check PYTHON=python RUFF=ruff
      - name: PostgreSQL smoke and persistence tests
        run: make test-db PYTHON=python

  ios:
    # Manual only: run it from the Actions tab when needed.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The shared package runs on the host Mac, without a simulator.
      - name: FootnoteKit tests
        run: swift test --package-path ios/FootnoteKit
      # Runner images do not always ship the same simulators, so resolve one that
      # is actually installed instead of pinning a device name.
      - name: Build app and run iOS tests
        run: |
          simulator=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
              | select(.key | contains("iOS"))
              | .value[]
              | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$simulator" ] || [ "$simulator" = "null" ]; then
            echo "No iPhone simulator is available on this runner image." >&2
            exit 1
          fi
          xcodebuild test \
            -project ios/Footnote.xcodeproj \
            -scheme Footnote \
            -destination "platform=iOS Simulator,id=$simulator" \
            CODE_SIGNING_ALLOWED=NO
      # The same target builds natively for the Mac (ADR 0008).
      - name: Build Mac app
        run: |
          xcodebuild build \
            -project ios/Footnote.xcodeproj \
            -scheme Footnote \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
