# Metadata only. Dependencies are managed exclusively in requirements.txt
# (single source of truth) -- do NOT add [project.dependencies] here.
[project]
name = "filing-footnote-backend"
version = "0.5.2"
description = "Filing Footnote backend - DART/SEC ingest and the app data build"
requires-python = "==3.11.*"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Korean fixture strings exceed the line limit; app code must stay within it.
"tests/*" = ["E501"]
