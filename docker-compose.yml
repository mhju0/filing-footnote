# filing-footnote 로컬 빌드 데이터베이스 (Compose Spec v2 스타일 - 최상위 `version:` 키는 사용하지 않음)
#
# 실행: `docker compose up -d db`. 수집(app.ingest)과 빌드(app.build)는 호스트에서 실행한다.
# 포트: postgres 5433(host) -> 5432(내부)

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      # 아래 기본값(filing_footnote / filing_footnote_dev / filing_footnote)은 "로컬 개발 전용" 기본값이며
      # 운영(production) 비밀번호가 아니다. 운영 환경에서는 반드시 호스트 환경변수로 덮어쓸 것.
      # 이미 초기화된 볼륨에서는 PostgreSQL이 이 값을 읽지 않는다 (기존 역할과 데이터는 그대로).
      POSTGRES_USER: ${POSTGRES_USER:-filing_footnote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filing_footnote_dev}
      POSTGRES_DB: ${POSTGRES_DB:-filing_footnote}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 최초 기동 시(빈 데이터 디렉토리일 때만) 스키마 초기화. Alembic 미사용 - docs/ARCHITECTURE.md 참고.
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # $$ 는 compose 치환을 피하고 컨테이너 내부 셸에서 환경변수를 읽기 위한 이스케이프.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
