# Filing Footnote: one SwiftUI app for iPhone, iPad and native Mac (ADR 0008).
# Generate the project after editing this file, from the repository root:
#   xcodegen generate --spec ios/project.yml
# The generated Footnote.xcodeproj is committed; scripts/check.sh fails while it is stale.
name: Footnote
options:
  bundleIdPrefix: com.filingfootnote
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.5.2
    CURRENT_PROJECT_VERSION: 1
    DEAD_CODE_STRIPPING: YES
packages:
  FootnoteKit:
    path: FootnoteKit
targets:
  Footnote:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Footnote
        excludes:
          # A development bundle copied here by hand; the build phase below copies it.
          - Resources/footnote.sqlite
      # Korean and English fact names, shared with the backend. The explicit group keeps
      # the project from naming a group after the checkout's folder.
      - path: ../contracts/filing-facts.json
        group: Contracts
        buildPhase: resources
    dependencies:
      - package: FootnoteKit
    postCompileScripts:
      - name: Copy data bundle
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # FOOTNOTE_BUNDLE (a build setting) wins, then ios/Footnote/Resources/footnote.sqlite
          # (git-ignored), then, in debug builds only, the FootnoteKit test fixture so a clean
          # checkout builds.
          source="${FOOTNOTE_BUNDLE:-${SRCROOT}/Footnote/Resources/footnote.sqlite}"
          if [ ! -f "$source" ]; then
            if [ "${CONFIGURATION}" = "Release" ]; then
              echo "error: a Release build needs a release data bundle at $source"
              exit 1
            fi
            source="${SRCROOT}/FootnoteKit/Tests/FootnoteKitTests/Fixtures/footnote.sqlite"
            echo "note: no data bundle at ios/Footnote/Resources/footnote.sqlite; using the FootnoteKit test fixture"
          fi
          if [ "${CONFIGURATION}" = "Release" ]; then
            unapproved="$(/usr/bin/sqlite3 -readonly "$source" 'SELECT allow_unapproved FROM build_meta' 2>&1)" || {
              echo "error: cannot read build_meta from $source: $unapproved"
              exit 1
            }
            if [ "$unapproved" != "0" ]; then
              echo "error: $source is a development bundle (allow_unapproved=$unapproved); a Release build ships only owner-approved summaries"
              exit 1
            fi
          fi
          destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/footnote.sqlite"
          mkdir -p "$(dirname "$destination")"
          cp "$source" "$destination"
    settings:
      base:
        PRODUCT_NAME: Footnote
        PRODUCT_BUNDLE_IDENTIFIER: com.filingfootnote.footnote
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Footnote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Theme.swift names the colours; generated symbols would clash with it.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        # The copy phase reads an optional file, which a sandboxed script cannot declare.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
  FootnoteTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FootnoteTests
      # The FootnoteKit development fixture, for the release-gate test.
      - path: FootnoteKit/Tests/FootnoteKitTests/Fixtures/footnote.sqlite
        buildPhase: resources
    dependencies:
      - target: Footnote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filingfootnote.footnote.tests
        GENERATE_INFOPLIST_FILE: YES
        # A Mac app keeps its executable under Contents/MacOS.
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Footnote.app/Contents/MacOS/Footnote
  # iOS only, in its own scheme so the Footnote scheme still tests on the Mac. It opens the
  # FootnoteKit fixture through the debug `-FootnoteBundle` launch argument.
  FootnoteUITests:
    type: bundle.ui-testing
    platform: auto
    supportedDestinations: [iOS]
    sources:
      - path: FootnoteUITests
      - path: FootnoteKit/Tests/FootnoteKitTests/Fixtures/footnote.sqlite
        buildPhase: resources
    dependencies:
      - target: Footnote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filingfootnote.footnote.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Footnote
schemes:
  Footnote:
    build:
      targets:
        Footnote: all
        FootnoteTests: [test]
    test:
      targets:
        - FootnoteTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
  FootnoteUITests:
    build:
      targets:
        Footnote: all
        FootnoteUITests: [test]
    test:
      targets:
        - FootnoteUITests
      gatherCoverageData: false
